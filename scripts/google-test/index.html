<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homi · Google Login Test</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 16px; background: #f0fdfa; color: #134e4a; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 620px; margin: 40px auto; padding: 32px; background: white; border: 1px solid #ccfbf1; border-radius: 16px; }
    h1 { margin-top: 0; color: #0F766E; }
    textarea { width: 100%; margin: 16px 0; padding: 12px; border: 1px solid #99f6e4; border-radius: 8px; resize: vertical; font: 13px/1.5 monospace; }
    button { padding: 10px 16px; margin: 4px 8px 4px 0; border: 0; border-radius: 8px; background: #0F766E; color: white; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #status { min-height: 26px; }
  </style>
  <script src="/sign-in.js" defer></script>
</head>
<body>
  <main>
    <h1>Homi</h1>
    <p>Sign in with Google to get an ID token for your local Postman test.</p>
    <div id="google-button"></div>
    <p id="status" role="status" aria-live="polite">Loading Google Sign-In…</p>
    <label for="token">Google ID token</label>
    <textarea id="token" rows="6" readonly autocomplete="off" spellcheck="false" placeholder="Your token appears here after sign-in."></textarea>
    <button id="copy" type="button" disabled>Copy ID token</button>
    <button id="clear" type="button" disabled>Clear token</button>
    <p>The token stays in this page until cleared or closed. Copying places it on your clipboard. This page does not submit it to your backend or any other service.</p>
  </main>
</body>
</html>
